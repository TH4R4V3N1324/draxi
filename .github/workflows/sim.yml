name: sim
on: [push, pull_request]

jobs:
  stand:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: GLFW build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DGLFW_BUILD_WAYLAND=OFF

      - name: Build
        run: cmake --build build --config Release --target draxi_sim

      - name: Stand for 8 s (Linux)
        if: runner.os == 'Linux'
        run: build/sim/draxi_sim --headless 8

      - name: Stand for 8 s (Windows)
        if: runner.os == 'Windows'
        run: build\sim\Release\draxi_sim.exe --headless 8